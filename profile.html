<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, rgba(99,102,241,0.12) 0px, transparent 60%),
                radial-gradient(at 100% 100%, rgba(236,72,153,0.12) 0px, transparent 60%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
        }

        .profile-container {
            flex: 1 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: 80px;
        }

        /* ─── Card Shell ─── */
        .profile-card {
            width: 100%;
            max-width: 400px;
            border-radius: 28px;
            overflow: hidden;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            box-shadow: 0 25px 60px rgba(0,0,0,0.12);
            animation: fadeUp 0.5s ease forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ─── Blue Header with image INSIDE ─── */
        .profile-header {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            padding: 55px 24px 35px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            text-align: center;
            min-height: 280px;
            overflow: hidden;
        }
        /* Decorative QR background pattern */
        .profile-header .qr-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.08;
        }
        /* Floating scan-corner indicators */
        .profile-header::before, .profile-header::after {
            content: '';
            position: absolute;
            width: 36px; height: 36px;
            border-color: rgba(255,255,255,0.6);
            border-style: solid;
            pointer-events: none;
        }
        .profile-header::before {
            top: 14px; left: 14px;
            border-width: 3px 0 0 3px;
            border-radius: 6px 0 0 0;
        }
        .profile-header::after {
            bottom: 14px; right: 14px;
            border-width: 0 3px 3px 0;
            border-radius: 0 0 6px 0;
        }

        .profile-header .theme-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .profile-header .theme-btn:hover {
            background: rgba(255,255,255,0.35);
        }

        /* ── Image sits inside the blue area ── */
        .profile-header .p-img-wrap {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 5px solid rgba(255,255,255,0.5);
            overflow: hidden;
            background: white;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            margin-bottom: 14px;
            flex-shrink: 0;
        }

        .profile-header .p-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .profile-header h2 {
            color: #fff;
            font-weight: 800;
            font-size: 1.35rem;
            margin: 0 0 6px 0;
        }

        .profile-header .company-badge {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 5px 18px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-top: 6px;
            display: inline-block;
        }

        /* ─── Body ─── */
        .profile-body {
            padding: 24px 20px 28px;
        }

        /* ─── Info Rows ─── */
        .info-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            background: rgba(99,102,241,0.05);
            border-radius: 16px;
            margin-bottom: 10px;
            text-decoration: none;
            color: inherit;
            transition: all 0.25s;
            border: 1px solid rgba(99,102,241,0.08);
        }

        .info-row:hover {
            background: rgba(99,102,241,0.1);
            transform: translateX(4px);
            color: inherit;
        }

        .info-row .icon-wrap {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .info-row .info-text p {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.5;
            margin: 0;
        }

        .info-row .info-text h6 {
            font-size: 0.97rem;
            font-weight: 600;
            margin: 2px 0 0;
            word-break: break-word;
        }

        /* ─── Notes ─── */
        .notes-box {
            background: rgba(99,102,241,0.05);
            border: 1px solid rgba(99,102,241,0.1);
            border-radius: 16px;
            padding: 16px;
            margin-top: 14px;
        }

        .notes-box .notes-title {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #6366f1;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .notes-box p {
            font-size: 0.93rem;
            opacity: 0.75;
            margin: 0;
            line-height: 1.6;
        }

        /* ─── Action Buttons ─── */
        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-row .btn {
            flex: 1;
            padding: 13px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.25s;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            box-shadow: 0 6px 20px rgba(99,102,241,0.35);
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(99,102,241,0.45);
            color: white;
        }

        .btn-outline-gradient {
            background: transparent;
            border: 2px solid #6366f1;
            color: #6366f1;
        }

        .btn-outline-gradient:hover {
            background: rgba(99,102,241,0.08);
            transform: translateY(-2px);
            color: #6366f1;
        }

        /* ─── Dark mode tweaks ─── */
        [data-theme="dark"] .info-row {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.07);
        }

        [data-theme="dark"] .info-row:hover {
            background: rgba(255,255,255,0.08);
        }

        [data-theme="dark"] .notes-box {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.07);
        }

        [data-theme="dark"] .btn-outline-gradient {
            border-color: #818cf8;
            color: #818cf8;
        }

        /* ─── Error Card ─── */
        .error-card {
            width: 100%;
            max-width: 400px;
            border-radius: 28px;
            padding: 50px 30px;
            text-align: center;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            box-shadow: 0 25px 60px rgba(0,0,0,0.12);
        }
        /* Professional Footer Styling */
        .main-footer {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--card-border);
            padding: 80px 0 30px;
            margin-top: auto;
            color: var(--text-color);
            transition: all 0.3s ease;
        }
        .footer-logo {
            font-weight: 800;
            font-size: 1.6rem;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            text-decoration: none;
        }
        .footer-description {
            opacity: 0.7;
            font-size: 0.98rem;
            line-height: 1.7;
            margin-bottom: 30px;
            max-width: 320px;
        }
        .footer-heading {
            font-weight: 700;
            font-size: 1.15rem;
            margin-bottom: 25px;
            position: relative;
            color: var(--text-color);
        }
        .footer-heading::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -8px;
            width: 35px;
            height: 2.5px;
            background: #6366f1;
            border-radius: 2px;
        }
        .footer-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .footer-links li {
            margin-bottom: 14px;
        }
        .footer-links a {
            text-decoration: none;
            color: var(--text-color);
            opacity: 0.65;
            font-weight: 500;
            transition: all 0.3s;
            display: inline-block;
        }
        .footer-links a:hover {
            opacity: 1;
            color: #6366f1;
            transform: translateX(6px);
        }
        .social-links {
            display: flex;
            gap: 12px;
        }
        .social-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(99, 102, 241, 0.08);
            color: #6366f1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            transition: all 0.3s;
            text-decoration: none;
            border: 1px solid rgba(99, 102, 241, 0.1);
        }
        .social-btn:hover {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
            border-color: transparent;
        }
        .footer-bottom {
            border-top: 1px solid var(--card-border);
            margin-top: 60px;
            padding-top: 30px;
            text-align: center;
            font-size: 0.92rem;
        }
        .footer-bottom p {
            opacity: 0.6;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- ═══════════════════════════════════════
         Profile Card
    ════════════════════════════════════════ -->
    <div class="profile-card" id="profileCard" style="display:none;">

        <!-- Blue Header — image lives here -->

            <!-- Decorative QR SVG background -->

                <rect x="8" y="143" width="22" height="22" rx="3" fill="#6366f1" opacity="0.6"/>
                <rect x="11" y="146" width="16" height="16" rx="2" fill="white" opacity="0.7"/>
                <!-- Data dots -->
                <rect x="42" y="8" width="6" height="6" rx="1" fill="white"/>
                <rect x="52" y="8" width="6" height="6" rx="1" fill="white"/>
                <rect x="62" y="8" width="10" height="6" rx="1" fill="white"/>

                <rect x="128" y="8" width="6" height="6" rx="1" fill="white"/>
                <rect x="42" y="18" width="10" height="6" rx="1" fill="white"/>
                <rect x="58" y="18" width="6" height="6" rx="1" fill="white"/>
                <rect x="68" y="18" width="6" height="6" rx="1" fill="white"/>
                <rect x="82" y="18" width="10" height="6" rx="1" fill="white"/>
                <rect x="100" y="18" width="6" height="6" rx="1" fill="white"/>
                <rect x="112" y="18" width="6" height="6" rx="1" fill="white"/>
                <rect x="122" y="18" width="10" height="6" rx="1" fill="white"/>
                <rect x="138" y="18" width="6" height="6" rx="1" fill="white"/>

                <rect x="74" y="28" width="6" height="6" rx="1" fill="white"/>
                <rect x="86" y="28" width="6" height="6" rx="1" fill="white"/>
                <rect x="96" y="28" width="10" height="6" rx="1" fill="white"/>

                <rect x="42" y="148" width="6" height="6" rx="1" fill="white"/>

                <rect x="58" y="158" width="6" height="6" rx="1" fill="white"/>

                <rect x="130" y="168" width="6" height="6" rx="1" fill="white"/>
            </svg>

            <!-- Theme toggle -->
            <button class="theme-btn" id="theme-toggle" title="Toggle dark mode">
                <i class="bi bi-moon-fill"></i>
            </button>

            <!-- Profile photo — INSIDE blue area -->
            <div class="p-img-wrap">
                <img src="" alt="Profile Photo" id="p-img">
            </div>

            <!-- Name + Company inside header -->
            <h2 id="p-name">—</h2>
            <span class="company-badge" id="p-company" style="display:none;"></span>
        </div>

        <!-- White / glass body -->
        <div class="profile-body">

            <!-- Phone -->
            <a href="#" class="info-row" id="link-mobile">
                <div class="icon-wrap"><i class="bi bi-telephone-fill"></i></div>
                <div class="info-text">
                    <p>Direct Call</p>
                    <h6 id="p-mobile">—</h6>
                </div>
            </a>

            <!-- Email -->
            <a href="#" class="info-row" id="link-email">
                <div class="icon-wrap"><i class="bi bi-envelope-fill"></i></div>
                <div class="info-text">
                    <p>Email Address</p>
                    <h6 id="p-email">—</h6>
                </div>
            </a>

            <!-- Address -->
            <div class="info-row">
                <div class="icon-wrap"><i class="bi bi-geo-alt-fill"></i></div>
                <div class="info-text">
                    <p>Location</p>
                    <h6 id="p-address">—</h6>
                </div>
            </div>

            <!-- Notes -->
            <div class="notes-box" id="notes-container" style="display:none;">
                <div class="notes-title">
                    <i class="bi bi-chat-left-quote-fill"></i> About Me
                </div>
                <p id="p-notes">—</p>
            </div>

            <!-- Action buttons -->
            <div class="action-row">
                <button class="btn btn-gradient" onclick="shareProfile()">
                    <i class="bi bi-share-fill me-2"></i>Share
                </button>
                <button class="btn btn-outline-gradient" onclick="saveContact()">
                    <i class="bi bi-person-check-fill me-2"></i>Save VCF
                </button>
            </div>

        </div><!-- /profile-body -->
    </div><!-- /profile-card -->

    <!-- ═══════════════════════════════════════
         Error state
    ════════════════════════════════════════ -->
    <div class="error-card" id="errorCard" style="display:none;">
        <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:3.5rem;"></i>
        <h4 class="fw-bold mt-4">Profile Not Found</h4>
        <p class="text-muted mt-2">This digital business card does not exist or has been removed.</p>
        <button class="btn btn-gradient mt-3 px-4" onclick="window.history.back()">Go Back</button>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
