<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — QR Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex; align-items: center; justify-content: center; padding: 20px;
            position: relative; overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute; inset: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(99,102,241,0.25) 0, transparent 50%),
                radial-gradient(circle at 80% 30%, rgba(168,85,247,0.25) 0, transparent 50%);
        }

        .login-card {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 28px;
            padding: 52px 44px;
            width: 100%; max-width: 440px;
            position: relative;
            animation: fadeUp 0.5s ease forwards;
        }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(20px); }
            to   { opacity:1; transform:translateY(0); }
        }

        .login-logo {
            text-align: center; margin-bottom: 36px;
        }
        .logo-icon {
            width: 72px; height: 72px; border-radius: 22px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; color: white; margin: 0 auto 16px;
            box-shadow: 0 8px 30px rgba(99,102,241,0.4);
        }
        .login-logo h2 {
            color: white; font-weight: 800; font-size: 1.6rem; margin: 0;
        }
        .login-logo p {
            color: rgba(255,255,255,0.5); font-size: 0.9rem; margin: 6px 0 0;
        }

        .form-label { color: rgba(255,255,255,0.75); font-weight: 600; font-size: 0.88rem; margin-bottom: 8px; }
        .input-group-text {
            background: rgba(255,255,255,0.08);
            border: 1.5px solid rgba(255,255,255,0.12);
            border-right: none; color: rgba(255,255,255,0.5);
        }
        .form-control {
            background: rgba(255,255,255,0.08);
            border: 1.5px solid rgba(255,255,255,0.12);
            border-left: none;
            color: white; padding: 13px 16px;
            font-family: inherit; font-size: 0.95rem;
            border-radius: 0 12px 12px 0 !important;
        }
        .form-control::placeholder { color: rgba(255,255,255,0.3); }
        .form-control:focus {
            background: rgba(255,255,255,0.12);
            border-color: rgba(99,102,241,0.6);
            box-shadow: 0 0 0 4px rgba(99,102,241,0.15);
            color: white;
        }
        .input-group-text { border-radius: 12px 0 0 12px !important; }

        .btn-login {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white; border: none; width: 100%;
            padding: 14px; border-radius: 14px;
            font-weight: 800; font-size: 1rem;
            letter-spacing: 0.02em; margin-top: 8px;
            transition: all 0.3s;
            box-shadow: 0 6px 24px rgba(99,102,241,0.4);
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(99,102,241,0.5);
        }

        .error-msg {
            display: none;
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5; border-radius: 12px;
            padding: 13px 16px; font-size: 0.9rem;
            font-weight: 600; text-align: center; margin-top: 12px;
        }

        .back-link {
            display: block; text-align: center; margin-top: 24px;
            color: rgba(255,255,255,0.4); font-size: 0.88rem;
            text-decoration: none; transition: color 0.2s;
        }
        .back-link:hover { color: rgba(255,255,255,0.7); }

        .hint-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; padding: 12px 16px;
            margin-bottom: 24px; text-align: center;
        }
        .hint-box p { color: rgba(255,255,255,0.4); font-size: 0.82rem; margin:0; }
        .hint-box strong { color: rgba(255,255,255,0.65); }

        /* Theme toggle on login page */
        .login-theme-toggle {
            position: fixed; top: 18px; right: 18px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.7); width: 40px; height: 40px;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 1rem; transition: all 0.2s; z-index: 100;
        }
        .login-theme-toggle:hover { background: rgba(255,255,255,0.2); color: white; }

        /* Footer */
        .login-footer {
            position: fixed; bottom: 0; left: 0; right: 0;
            text-align: center; padding: 14px;
            color: rgba(255,255,255,0.25); font-size: 0.8rem;
        }
        .login-footer a { color: rgba(255,255,255,0.4); text-decoration: none; }
        .login-footer a:hover { color: rgba(255,255,255,0.7); }
    </style>
</head>
<body>

<!-- Theme toggle button -->
<button class="login-theme-toggle" id="themeToggle" title="Toggle theme">
    <i class="bi bi-moon-fill"></i>
</button>

<div class="login-card">
    <div class="login-logo">
        <div class="logo-icon"><i class="bi bi-shield-lock-fill"></i></div>
        <h2>Admin Login</h2>
        <p>Sign in to access the QR Pro dashboard</p>
    </div>

    <form id="loginForm" onsubmit="doLogin(event)">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                <input type="text" class="form-control" id="username" placeholder="Enter username" required>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control" id="password" placeholder="Enter password" required>
            </div>
        </div>
        <button type="submit" class="btn-login">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Dashboard
        </button>
        <div class="error-msg" id="errorMsg">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>Incorrect username or password.
        </div>
    </form>

    <a href="index.html" class="back-link">
        <i class="bi bi-arrow-left me-1"></i>Back to Home
    </a>
</div>

<!-- Footer -->
<footer class="login-footer">
    &copy; 2025 QR Pro &nbsp;|&nbsp;
    <a href="index.html">Home</a> &nbsp;|&nbsp;
    <a href="about.html">About</a> &nbsp;|&nbsp;
    <a href="contact.html">Contact</a>
</footer>

<script>
    // Dark mode (login page stays dark but toggles between deep dark and slightly lighter)
    const html = document.documentElement;
    const toggle = document.getElementById('themeToggle');
    const saved = localStorage.getItem('qrpro_theme') || 'light';
    // Apply saved theme icon (page is always dark-styled)
    toggle.innerHTML = saved === 'dark' ? '<i class="bi bi-sun-fill"></i>' : '<i class="bi bi-moon-fill"></i>';
    toggle.addEventListener('click', () => {
        const next = (localStorage.getItem('qrpro_theme') || 'light') === 'dark' ? 'light' : 'dark';
        localStorage.setItem('qrpro_theme', next);
        toggle.innerHTML = next === 'dark' ? '<i class="bi bi-sun-fill"></i>' : '<i class="bi bi-moon-fill"></i>';
    });

    // Auth redirect
    if (sessionStorage.getItem('qrpro_admin_auth') === 'true') {
        window.location.href = 'admin.html';
    }

    function doLogin(e) {
        e.preventDefault();
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value;
        const err  = document.getElementById('errorMsg');
        if (user === 'admin' && pass === 'admin@123') {
            sessionStorage.setItem('qrpro_admin_auth', 'true');
            window.location.href = 'admin.html';
        } else {
            err.style.display = 'block';
            setTimeout(() => err.style.display = 'none', 3000);
        }
    }
</script>
</body>
</html>
